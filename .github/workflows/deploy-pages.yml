name: Site on main (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site files
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/main.js
          echo "Site pronto na branch main para GitHub Pages."
